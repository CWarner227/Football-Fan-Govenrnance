name: football-governance
services:
  dashboard:
    image: football-governance-dashboard:local
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dashboard-data:/app/data/dashboard
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  dashboard-data:
