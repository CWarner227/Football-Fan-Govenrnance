name: football-governance
services:
  dashboard:
    image: football-governance-dashboard:local
    build: .
    init: true
    environment:
      FAN_GOVERNANCE_TRIAL_WORKERS: ${FAN_GOVERNANCE_TRIAL_WORKERS:-0}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dashboard-data:/app/data/dashboard
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  dashboard-data:
