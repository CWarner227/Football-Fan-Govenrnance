experiment:
  name: voting_model_comparison
  trials: 100
  seed: 42
population:
  size: 10000
  wealth_distribution:
    type: lognormal
    parameters: {mean: 10.0, sigma: 1.0}
    lower: 0
  contribution_distribution:
    type: lognormal
    parameters: {mean: 4.0, sigma: 1.5}
    lower: 0
governance:
  waiting_period_days: 180
  quorum: 0.2
  approval_threshold: 0.5
voting:
  strategies:
    - equal
    - proportional
    - name: capped
      parameters: {cap: 100}
    - name: diminishing
      parameters: {scale: 10, multiplier: 1}
participation:
  name: probabilistic
preference:
  name: synthetic
  parameters: {approval_probability: 0.5, abstention_probability: 0.0}
output:
  directory: results/voting_comparison
  formats: [csv, json]
