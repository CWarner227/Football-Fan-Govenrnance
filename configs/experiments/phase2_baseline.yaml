experiment:
  name: phase2_baseline
  trials: 100
  seed: 42
  proposal_categories: [constitutional, funding]
population:
  size: 10000
  wealth: {distribution: lognormal, mean: 10.0, sigma: 1.0}
  contribution: {model: wealth_fraction, min_fraction: 0.001, max_fraction: 0.02}
  loyalty: {distribution: beta, alpha: 4, beta: 2}
  participation_rate: {distribution: beta, alpha: 3, beta: 4}
  knowledge_score: {distribution: beta, alpha: 2, beta: 3}
  membership_age_days: {distribution: uniform, min: 0, max: 1825}
  forecast_accuracy: {distribution: beta, alpha: 5, beta: 4}
  forecast_sample_count: {distribution: constant, value: 100}
  preferred_policy:
    distribution: categorical
    categories: [community_investment, financial_reserve, neutral]
    probabilities: [0.45, 0.45, 0.10]
  adversarial_fraction: 0
governance:
  waiting_period_days: 180
  quorum: 0.2
  approval_threshold: 0.5
proposal:
  proposal_id: baseline-policy
  category: constitutional
  metadata: {policy_alignment: community_investment, synthetic: true}
participation: {name: probabilistic}
preference:
  name: synthetic
  parameters: {approval_probability: 0.5, abstention_probability: 0}
voting:
  strategies:
    - equal
    - name: proportional
      parameters: {reference_contribution: 100}
    - name: capped
      parameters: {max_weight: 5, base_weight: 1, reference_contribution: 100}
    - name: diminishing
      parameters: {max_weight: 5, base_weight: 1, reference_contribution: 100}
    - name: hybrid
      parameters:
        default_strategy: equal
        proposal_rules:
          constitutional: equal
          board_election: equal
          fan_experience: equal
          funding:
            name: capped
            parameters: {max_weight: 5, base_weight: 1, reference_contribution: 100}
    - name: expertise
      parameters:
        expertise_multiplier: 2
        minimum_samples: 20
        confidence_z: 1.96
        chance_accuracy: 0.5
        max_weight: 3
output:
  directory: results/phase2_baseline
  formats: [csv, json, parquet]
