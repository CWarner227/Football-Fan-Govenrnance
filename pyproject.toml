[project]
name = "fan-governance-simulator"
version = "0.3.0"
description = "A modular research framework for synthetic fan governance experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.9",
]
parquet = [
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fan_governance"
source-include = ["configs/**", "docs/**", "tests/**", "examples/**", "uv.lock"]

[project.scripts]
fan-governance = "fan_governance.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = [".uv-cache", ".venv-sim", ".pytest-*", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
